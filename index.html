<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hausvorrat</title>
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hausvorrat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #f6f4ef; color: #1f2a22;
               font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
  #einrichten { display: none; max-width: 420px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  #einrichten img { width: 88px; height: 88px; border-radius: 20px; }
  #einrichten h1 { font-size: 22px; margin: 16px 0 6px; }
  #einrichten p { color: #6b736c; font-size: 14px; margin: 0 0 16px; }
  #einrichten input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border: 1.5px solid #e4e0d6; border-radius: 10px; }
  #einrichten button { margin-top: 10px; width: 100%; font: inherit; padding: 12px; border: 0; border-radius: 10px; background: #3b4a3f; color: #fff; }
  #fehler { color: #b3261e; font-size: 13px; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
<iframe id="app" title="Hausvorrat" allow="clipboard-write"></iframe>

<div id="einrichten">
  <img src="icon-192.png" alt="">
  <h1>Hausvorrat</h1>
  <p>Einmalig: Bitte den App-Link einfügen, den du bekommen hast<br>(beginnt mit https://script.google.com/…).</p>
  <input id="link" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <button id="ok">Speichern und öffnen</button>
  <div id="fehler"></div>
</div>

<script>
  // Der eigentliche App-Link steht NICHT in dieser Datei (das Projekt ist öffentlich).
  // Er kommt aus dem Link hinter dem #-Zeichen oder wird einmalig auf dem Handy gespeichert.
  var SCHLUESSEL = 'hausvorrat-app-link';
  var gueltig = function (u) { return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u); };
  var merken = function (u) { try { localStorage.setItem(SCHLUESSEL, u); } catch (e) {} };
  var gemerkt = function () { try { return localStorage.getItem(SCHLUESSEL) || ''; } catch (e) { return ''; } };

  function starten(u) {
    var f = document.getElementById('app');
    f.src = u;
    f.style.display = 'block';
    document.getElementById('einrichten').style.display = 'none';
  }

  var ausLink = decodeURIComponent((location.hash || '').slice(1)).trim();
  if (gueltig(ausLink)) { merken(ausLink); starten(ausLink); }
  else if (gueltig(gemerkt())) { starten(gemerkt()); }
  else { document.getElementById('einrichten').style.display = 'block'; }

  document.getElementById('ok').onclick = function () {
    var u = document.getElementById('link').value.trim();
    if (!gueltig(u)) {
      document.getElementById('fehler').textContent = 'Das ist kein gültiger App-Link. Er muss mit /exec enden.';
      return;
    }
    merken(u); starten(u);
  };
</script>
</body>
</html>
